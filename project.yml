name: GrokBotEater
options:
  bundleIdPrefix: com.emersonspiff.grokboteater
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  groupSortPosition: top
  defaultLocalization: en

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "S7B8M9JYF4"
    MARKETING_VERSION: "5.13.3"
    CURRENT_PROJECT_VERSION: "546"
    ARCHS: "arm64 x86_64"

targets:
  GrokBotEaterApp:
    type: application
    platform: macOS
    sources:
      - path: TokenEaterApp
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emersonspiff.grokboteater.app
        PRODUCT_NAME: GrokBotEater
        CODE_SIGN_ENTITLEMENTS: TokenEaterApp/TokenEaterApp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: TokenEaterApp/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.utilities
        CFBundleDisplayName: GrokBotEater
        LSUIElement: true
        CFBundleURLTypes:
          - CFBundleURLName: com.emersonspiff.grokboteater.app
            CFBundleURLSchemes:
              - grokboteater
    preBuildScripts:
      - script: |
          osacompile -o "$BUILT_PRODUCTS_DIR/$PRODUCT_NAME.app/Contents/Resources/GrokBotEaterInstaller.app" "$SRCROOT/TokenEaterApp/Resources/installer.applescript"
          cp "$SRCROOT/TokenEaterApp/Resources/te-update.sh" "$BUILT_PRODUCTS_DIR/$PRODUCT_NAME.app/Contents/Resources/GrokBotEaterInstaller.app/Contents/Resources/te-update.sh"
        name: Compile installer applets
    dependencies:
      - target: GrokBotEaterWidgetExtension
        embed: true

  GrokBotEaterTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TokenEaterTests
      - path: Shared
      - path: TokenEaterApp/Onboarding/OnboardingViewModel.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emersonspiff.grokboteater.tests
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"

  GrokBotEaterWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: TokenEaterWidget
        excludes:
          - Info.plist
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emersonspiff.grokboteater.app.widget
        PRODUCT_NAME: GrokBotEaterWidgetExtension
        MARKETING_VERSION: "5.13.3"
        CURRENT_PROJECT_VERSION: "546"
        CODE_SIGN_ENTITLEMENTS: TokenEaterWidget/TokenEaterWidget.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
    info:
      path: TokenEaterWidget/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  GrokBotEaterTests:
    build:
      targets:
        GrokBotEaterTests: [test]
    test:
      config: Debug
      targets:
        - GrokBotEaterTests

  GrokBotEaterApp:
    build:
      targets:
        GrokBotEaterApp: all
        GrokBotEaterWidgetExtension: all
    run:
      config: Debug
    archive:
      config: Release
